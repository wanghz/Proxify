name: Delete old migrations

on:
  schedule:
    - cron: '10 */12 * * *'
  workflow_dispatch:

jobs:
  delete_files:
    runs-on: ubuntu-latest
    name: Delete old migrations
    steps:
      - uses: actions/checkout@v4  # 使用最新版checkout
        with:
          fetch-depth: 0  # 确保获取完整历史（用于正确获取文件修改时间）
          
      - name: Delete old files
        uses: chenrui333/delete-old-files-action@v2
        with:
          # 要清理的目录（根据你的需求修改，原配置是./api/migrations，错误日志里是./configs/mixed）
          directory: ./v2rayconfigs/mixed
          # 文件保留天数
          days: 5
          # 只删除文件（不删除目录）
          delete-folders: false
          
      - name: Create PR with deletions
        uses: peter-evans/create-pull-request@v6
        with:
          title: "Delete old migrations (older than 5 days)"
          body: "Automatically delete files in ./api/migrations that are older than 5 days"
          branch: delete-old-migrations
          base: master
          commit-message: "chore: delete old migrations older than 5 days"

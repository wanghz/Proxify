name: Delete old migrations

on:
  schedule:
    - cron: '10 */12 * * *'
  workflow_dispatch:

jobs:
  delete_old_files:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 允许推送分支
      pull-requests: write  # 允许创建PR
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史，确保文件修改时间准确

      - name: 清理超过60天的旧迁移文件
        run: |
          # 定义目标目录（请确认路径正确）
          TARGET_DIR="./v2ray_configs/mixed"
          
          # 检查目录是否存在
          if [ ! -d "$TARGET_DIR" ]; then
            echo "目录 $TARGET_DIR 不存在，跳过清理"
            exit 0
          fi
          
          # 查找并删除超过60天的文件（只删文件，不删目录）
          echo "开始清理 $TARGET_DIR 中超过5天的文件..."
          DELETED_FILES=$(find "$TARGET_DIR" -type f -mtime +5 -print)
          
          # 如果没有要删除的文件，退出
          if [ -z "$DELETED_FILES" ]; then
            echo "没有超过60天的文件需要删除"
            exit 0
          fi
          
          # 打印要删除的文件列表（便于日志查看）
          echo "即将删除以下文件："
          echo "$DELETED_FILES"
          
          # 执行删除
          find "$TARGET_DIR" -type f -mtime +5 -delete
          echo "清理完成！"

      - name: 自动创建PR提交变更
        uses: peter-evans/create-pull-request@v6
        with:
          title: "chore: 删除超过60天的旧迁移文件"
          body: |
            自动执行的旧文件清理任务：
            - 清理目录：./v2ray_configs/mixed
            - 清理规则：删除修改时间超过60天的文件
            - 自动生成，确认无误后可合并
          branch: auto/delete-old-migrations  # 临时分支名称
          base: main  # 目标合并分支（如果主分支是main，这里改成main）
          commit-message: "chore: 删除./v2ray_configs/mixed中超过5天的旧文件"
          delete-branch: true  # PR合并后自动删除临时分支
          draft: false
